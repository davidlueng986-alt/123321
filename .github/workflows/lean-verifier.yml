name: Lean 4 / Mathlib proof verification

on:
  push:
    branches: [math-agent-lean-verifier]
    paths:
      - "**/*.lean"
      - "lean-toolchain"
      - "lakefile.toml"
      - ".github/workflows/lean-verifier.yml"
  pull_request:
    branches: [math-agent-lean-verifier]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Checkout proof repository
        uses: actions/checkout@v4

      - name: Reject proof holes and local axioms
        shell: bash
        run: |
          if grep -RInE '(^|[^[:alnum:]_])(sorry|sorryAx|admit|axiom|constant|unsafe)([^[:alnum:]_]|$)' --include='*.lean' MathAgent.lean MathAgent/; then
            echo "::error::Proof holes, unproved axioms, or unsafe declarations are not allowed in submitted sources."
            exit 1
          fi

      - name: Bootstrap elan and Lean for dependency resolution
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Create Lake dependency manifest
        run: lake update

      - name: Compile and kernel-check with Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          use-mathlib-cache: true
          use-github-cache: true

name: MOLS10 E044 independent exact replay
on:
  push:
    branches: [math-agent-mols10]
    paths: ['.github/workflows/mols10-e044.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-agent-mols10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CPU dependencies
        run: python -m pip install numpy scipy
      - name: Generate, certify and independently replay 512 fixed prefixes
        working-directory: research/mols10
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python E044_disjoint_probe.py --attempts 512 --seconds 95 > E044_SCAN.log
          python E044_certify.py > E044_CERTIFY.log
          node E044_verify.js > E044_VERIFY_OUTPUT.json
          python E044_k3_controls.py > E044_K3.log
          sha256sum E044_RESULTS.json E044_CERTIFICATES.json E044_K3_CONTROLS.json > E044_REPLAY_SHA256.txt
          cat E044_VERIFY_OUTPUT.json
      - name: Persist exact evidence in branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mols10/E044_RESULTS.json research/mols10/E044_CERTIFICATES.json research/mols10/E044_K3_CONTROLS.json research/mols10/E044_SCAN.log research/mols10/E044_CERTIFY.log research/mols10/E044_VERIFY_OUTPUT.json research/mols10/E044_K3.log research/mols10/E044_REPLAY_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "mols10 E044: GitHub Actions independently reproduced 512 exact certificates"
            git push origin HEAD:math-agent-mols10
          fi

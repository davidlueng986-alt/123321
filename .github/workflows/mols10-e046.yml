name: MOLS10 E046 local-trade LP probe
on:
  push:
    branches: [math-agent-mols10]
    paths: ['.github/workflows/mols10-e046.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-agent-mols10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CPU dependencies
        run: python -m pip install numpy scipy
      - name: Bounded phase-I LP and exact certificate replay
        working-directory: research/mols10
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          node E046_trade_scan.js > E046_TRADE_REPLAY.json
          python E046_phase1.py > E046_PHASE1.log
          node E046_phase1_verify.js > E046_PHASE1_VERIFY.json
          sha256sum E046_TRADE_REPLAY.json E046_PHASE1_RESULTS.json E046_PHASE1_VERIFY.json > E046_SHA256.txt
          cat E046_PHASE1_VERIFY.json
      - name: Persist remote evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mols10/E046_TRADE_REPLAY.json research/mols10/E046_PHASE1_RESULTS.json research/mols10/E046_PHASE1_VERIFY.json research/mols10/E046_PHASE1.log research/mols10/E046_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "mols10 E046: remote exact replay and bounded local-trade LP probe"
            git push origin HEAD:math-agent-mols10
          fi

name: MOLS10 E047 exact two-disjoint-swap neighborhood
on:
  push:
    branches: [math-agent-mols10]
    paths: ['.github/workflows/mols10-e047.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-agent-mols10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CPU-only numerical dependencies
        run: python -m pip install numpy scipy
      - name: Regenerate 479 exact local certificates and independently replay
        working-directory: research/mols10
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python E047_reproduce.py > E047_REMOTE.log
          node E047_replay.js > E047_REMOTE_VERIFY.json
          sha256sum E047_SOURCES.json E047_REGENERATED.json E047_REMOTE_VERIFY.json > E047_REMOTE_SHA256.txt
          cat E047_REMOTE_VERIFY.json
      - name: Persist remote exact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mols10/E047_REGENERATED.json research/mols10/E047_REMOTE_VERIFY.json research/mols10/E047_REMOTE.log research/mols10/E047_REMOTE_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "mols10 E047: remote 479 exact certificates and independent replay"
            git push origin HEAD:math-agent-mols10
          fi

name: Cap Set F3-7 Verifier

on:
  push:
    branches: ["research/capset-f3-7"]
    paths:
      - "research/capset_f3_7/**"
      - ".github/workflows/capset-f3-7.yml"
  pull_request:
    branches: ["research/capset-f3-7"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact verifier unit tests
        run: python -m unittest discover -s research/capset_f3_7 -p 'test_*.py' -v
      - name: Certify symmetry orbits and 16-removal isolation
        run: python research/capset_f3_7/symmetry_isolation_certificate.py
      - name: Certify six orbit-wise incidence obstructions
        run: python research/capset_f3_7/orbit_incidence_certificate.py
      - name: Check rational dual proof certificate (no optimizer)
        run: python research/capset_f3_7/rational_dual_48_certificate.py
      - name: Verify rational dual certificate over 71 outsider points
        run: python research/capset_f3_7/rational_dual_71_certificate.py
      - name: Verify exact dual for seeded 116 outsider candidate pool
        run: python research/capset_f3_7/rational_dual_116_certificate.py
      - name: Audit 1093 hyperplane normals and Parseval identity
        run: python research/capset_f3_7/hyperplane_spectrum_certificate.py --include-8d
      - name: Classify all 189 coordinate 5D fibers and 27-block combinations
        run: python research/capset_f3_7/fiber_saturation_certificate.py
      - name: Independently reconstruct C6 Paley magic basis and order-240 group
        run: python research/capset_f3_7/paley_magic_basis_240_certificate.py
      - name: Audit all signed-permutation relative shadow templates
        run: python research/capset_f3_7/magic_signed_relative_shadow_certificate.py
      - name: Certify exact 240-invariant 7D optimum (restricted theorem)
        run: python research/capset_f3_7/c6_invariant_exact_optimum.py
      - name: Certify exact order-120 invariant 7D optimum 236 (restricted theorem)
        run: python research/capset_f3_7/c6_even120_invariant_exact_optimum.py
      - name: Certify derived-60 orbit equivalence and order-24 subgroup complexity
        run: python research/capset_f3_7/c6_subgroup_lattice_certificate.py
      - name: Certify exact order-24 high-slice restricted optimum 236
        run: python research/capset_f3_7/c6_order24_high_slice_exact.py
      - name: Verify exact 24-invariant orbit SAT reduction (236 SAT witness; 237 decision open)
        run: |
          python research/capset_f3_7/c6_order24_sat_encoding.py --target 236
          python research/capset_f3_7/c6_order24_sat_encoding.py --target 237 --out /tmp/capset_order24_target237.cnf
      - name: Preserve deterministic 237-target CNF artifact
        uses: actions/upload-artifact@v4
        with:
          name: capset-order24-target237-cnf
          path: /tmp/capset_order24_target237.cnf
          retention-days: 30
      - name: Check all 1920 signed-relative complementary 112-cap pairs
        run: python research/capset_f3_7/complement_112_signed_shadow_certificate.py
      - name: Run deterministic sample and recheck artifact
        run: |
          python research/capset_f3_7/search_baseline.py --seed 7 --rounds 2 --out /tmp/capset_candidate.txt
          python research/capset_f3_7/verify_capset.py /tmp/capset_candidate.txt
      - name: Reproduce and verify original 236-point construction
        run: |
          python research/capset_f3_7/generate_calderbank_fishburn.py --out /tmp/calderbank_fishburn_236.txt
          cmp research/capset_f3_7/candidates/calderbank_fishburn_236.txt /tmp/calderbank_fishburn_236.txt
          python research/capset_f3_7/verify_capset.py /tmp/calderbank_fishburn_236.txt
      - name: Install CPU-only rational dual search dependency
        run: python -m pip install --disable-pip-version-check scipy==1.16.3
      - name: Certify all 312 five-fiber LP duals by exact fractions
        run: python research/capset_f3_7/cap005_k5_rational_duals.py --out /tmp/cap005_k5_rational_duals.json
      - name: Preserve all 312 rational dual certificates
        uses: actions/upload-artifact@v4
        with:
          name: capset-k5-rational-duals
          path: /tmp/cap005_k5_rational_duals.json
          retention-days: 30
      - name: Preserve deterministic six-fiber necessary gate census
        run: python research/capset_f3_7/cap005_k6_secant_matching_gate.py --out /tmp/cap005_k6_gate.json
      - name: Archive six-fiber necessary gate JSON (not a global bound)
        uses: actions/upload-artifact@v4
        with:
          name: capset-k6-necessary-gate
          path: /tmp/cap005_k6_gate.json
          retention-days: 30
      - name: Independently recompute all outsider-pair deletion minima (C++17)
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -pedantic research/capset_f3_7/cap005_pair_cover_independent.cpp -o /tmp/cap005_paircheck
          /tmp/cap005_paircheck research/capset_f3_7/candidates/calderbank_fishburn_236.txt
      - name: Certify pair-removal strengthened six-fiber necessary gate
        run: python research/capset_f3_7/cap005_k6_pair_gate.py --out /tmp/cap005_k6_pair_gate.json
      - name: Archive six-fiber pair-removal gate (restricted theorem only)
        uses: actions/upload-artifact@v4
        with:
          name: capset-k6-pair-removal-gate
          path: /tmp/cap005_k6_pair_gate.json
          retention-days: 30
      - name: Generate 680 exact six-fiber conflict clique certificates
        run: python research/capset_f3_7/cap005_k6_clique_cover_certificate.py --out /tmp/cap005_k6_clique_cover.json
      - name: Independently verify 680 clique certificates by direct mod-3 arithmetic
        run: |
          python research/capset_f3_7/cap005_k6_clique_cover_check.py /tmp/cap005_k6_clique_cover.json
          echo "12bf1b9787390691072e6b627afaf73fa44fcab3db13c35479d004fa57bb830f  /tmp/cap005_k6_clique_cover.json" | sha256sum --check
      - name: Archive 680 six-fiber clique certificates (restricted theorem only)
        uses: actions/upload-artifact@v4
        with:
          name: capset-k6-clique-cover-680
          path: /tmp/cap005_k6_clique_cover.json
          retention-days: 30
      - name: Generate 848 exact-rational six-fiber LP dual certificates (CPU)
        run: OPENBLAS_NUM_THREADS=1 python research/capset_f3_7/cap005_k6_lp_dual_certificate.py --out /tmp/cap005_k6_lp_duals.json
      - name: Independently verify 848 rational dual certificates against F3 arithmetic
        run: |
          python research/capset_f3_7/cap005_k6_lp_dual_check.py /tmp/cap005_k6_lp_duals.json --previous /tmp/cap005_k6_clique_cover.json
          sha256sum /tmp/cap005_k6_lp_duals.json
      - name: Archive 848 six-fiber rational dual certificates (restricted theorem only)
        uses: actions/upload-artifact@v4
        with:
          name: capset-k6-rational-duals-848
          path: /tmp/cap005_k6_lp_duals.json
          retention-days: 30
      - name: Check complete-cap saturation and replacement barrier
        run: python research/capset_f3_7/analyze_secants.py research/capset_f3_7/candidates/calderbank_fishburn_236.txt

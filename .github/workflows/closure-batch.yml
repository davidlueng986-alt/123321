name: Exact closure batch replay
on:
  push:
    branches: [math-agent-mols10, research/capset-f3-7]
    paths:
      - 'research/closure_batch/**'
      - '.github/workflows/closure-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: closure-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently replay finite controls and row-factorization certificate
        run: node research/closure_batch/run_batch.js
      - name: Independently verify forced-prefix nonextension and its negative controls
        run: |
          python3 -m unittest discover -s research/closure_batch -p test_forced_prefix.py -v
          python3 research/closure_batch/verify_forced_prefix.py
      - name: Verify normalized nogood and bounded search integration
        run: |
          node research/closure_batch/test_normalized_cut.js
          node research/closure_batch/certified_search.js
      - name: Independently check all ten binary-relaxation countermodels
        run: node research/closure_batch/verify_cap_binary.js

name: MOLS10 E060 full OA positive and anchored replay
on:
  workflow_dispatch:
  push:
    branches: [math-agent-mols10]
    paths:
      - 'research/mols10/E060_*'
      - '.github/workflows/mols10-e060.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Validate checked-in data and reconstruct all 84 exhaustive anchored tests
        shell: bash
        run: |
          set -euo pipefail
          cd research/mols10
          node E060_validate_outputs.js
          OPENBLAS_NUM_THREADS=1 python E060_all_six_row_extensions.py > e060_ci_84.log
          tail -n 1 e060_ci_84.log
          node E060_validate_outputs.js
      - name: Verify direct full OA positive controls
        shell: bash
        run: |
          set -euo pipefail
          cd research/mols10
          OPENBLAS_NUM_THREADS=1 python E060_full_OA_milp.py 4 3
          OPENBLAS_NUM_THREADS=1 python E060_full_OA_milp.py 5 10
